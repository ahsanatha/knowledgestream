services:
  knowledgestream:
    build: .
    expose:
      - "8080"
    environment:
      - REDIS_ADDR=redis:6379
      - SSE_URL=https://stream.wikimedia.org/v2/stream/mediawiki.recentchange,page-create,page-links-change,recentchange,mediawiki.page-links-change
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    develop:
      watch:
        - path: ./cmd
          action: rebuild
        - path: ./internal
          action: rebuild
        - path: go.mod
          action: rebuild
        - path: go.sum
          action: rebuild

  redis:
    image: redis:7-alpine
    expose:
      - "6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped
